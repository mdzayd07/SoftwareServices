spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: services-site-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/services_site}
    username: ${DB_USERNAME:services_site}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
    from: ${MAIL_FROM:no-reply@localhost}

server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8090,http://13.140.146.12:8090,http://13.140.146.12}
  admin:
    email: ${ADMIN_EMAIL:mdzain2545@gmail.com}
    password: ${ADMIN_PASSWORD:adminDevPassword123}
  leads:
    notify-to: ${LEAD_NOTIFY_TO:mdzain2545@gmail.com}
    retention-days: ${LEAD_RETENTION_DAYS:90}
