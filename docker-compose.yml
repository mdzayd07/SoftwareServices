services:
  db:
    image: postgres:16-alpine
    container_name: northline_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-services_site}
      POSTGRES_USER: ${POSTGRES_USER:-services_site}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secureProductionDbPassword123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-services_site} -d ${POSTGRES_DB:-services_site}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - northline_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: northline_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8085}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-services_site}
      DB_USERNAME: ${POSTGRES_USER:-services_site}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secureProductionDbPassword123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@northlinesoftware.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisStrongAdminPass2026!}
      LEAD_NOTIFY_TO: ${LEAD_NOTIFY_TO:-contact@northlinesoftware.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090,http://13.140.146.12:8090,http://localhost:4200}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@northlinesoftware.com}
    networks:
      - northline_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: northline_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4010}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
    networks:
      - northline_net

  nginx:
    image: nginx:alpine
    container_name: northline_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - northline_net

volumes:
  pgdata:
  certs:

networks:
  northline_net:
    driver: bridge
